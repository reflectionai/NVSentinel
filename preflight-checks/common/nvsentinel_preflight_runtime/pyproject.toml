[tool.poetry]
name = "nvsentinel-preflight-runtime"
version = "0.1.0"
description = "Shared runtime bootstrap (structured logger + rank/pod context) for NVSentinel preflight checks"
authors = ["NVIDIA"]
packages = [{include = "nvsentinel_preflight_runtime"}]

[tool.poetry.dependencies]
python = "^3.10"
structlog = "^25.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.0"
ruff = ">=0.11,<0.16"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
